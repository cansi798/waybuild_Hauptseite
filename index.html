<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>waybuild – Vorschau</title>
<style>
  :root { --bg: #f7f8f8; --text: #1f2a2e; --muted: #545454; --it: #00A6A1; --ak: #0079A6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101617; --text: #eef2f1; --muted: #a6b0b1; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--text); font: 17px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; text-align: center; }
  h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); margin: 0 0 12px; letter-spacing: -0.02em; }
  h1 span { color: var(--it); }
  p { margin: 0 0 20px; color: var(--muted); }
  .bar { height: 4px; width: 120px; margin: 0 auto 28px; border-radius: 2px;
         background: linear-gradient(90deg, var(--it), var(--ak)); }
</style>
</head>
<body>
<main>
  <h1>way<span>build</span></h1>
  <div class="bar"></div>
  <p>Hier entsteht die neue Hauptseite.</p>
  <p>Vorschau – noch nicht öffentlich.</p>
</main>
</body>
</html>
